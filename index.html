<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NaaS / LaaS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar__inner">
      <div class="brand">
        <span class="logo-dot" aria-hidden="true"></span>
        <span class="brand__text"><a href="https://github.com/prasadgitit/naas">GitHub</a></span>
      </div>

      <nav class="nav">
        <a class="nav__link" href="#naasSection">NaaS</a>
        <a class="nav__link" href="#laasSection">LaaS</a>
      </nav>
    </div>
  </header>

  <main class="container">

    <!-- NaaS -->
    <section id="naasSection" class="panel" aria-labelledby="naasTitle">
      <header class="panel__header">
        <h1 id="naasTitle" class="title">NaaS — No As A Service</h1>
        <p class="subtitle">Fetch a universal, cloud‑powered “No”.</p>
      </header>

      <div class="card">
        <div class="controls">
          <button id="generateBtn" class="btn btn-primary">
            <span>Get a “No”</span>
          </button>

          <button id="copyBtn" class="btn btn-ghost" disabled>
            <span>📋</span>
            <span class="copy-label">Copy</span>
          </button>
        </div>

        <div class="output">
          <p id="result" class="output-text" aria-live="polite">Press “Get a No”.</p>
        </div>
      </div>
    </section>

    <hr class="divider"/>

    <!-- LaaS -->
    <section id="laasSection" class="panel" aria-labelledby="laasTitle">
      <header class="panel__header">
        <h2 id="laasTitle" class="title">LaaS — Lies As A Service</h2>
        <p class="subtitle">Pick a category to generate a lie.</p>
      </header>

      <div class="card">
        <div class="controls controls-wrap">
          <label class="field">
            <span class="field-label">Category</span>
            <select id="laasCategory" class="select">
              <option value="sick">sick</option>
              <option value="meeting">meeting</option>
              <option value="deadline">deadline</option>
              <option value="remote">remote</option>
              <option value="technical">technical</option>
              <option value="manager">manager</option>
			  <option value="tech">tech</option>
			  <option value="random">random</option>
            </select>
          </label>

          <button id="laasGenerateBtn" class="btn btn-primary">
            <span>Get a Lie</span>
          </button>

          <button id="laasCopyBtn" class="btn btn-ghost" disabled>
            <span>📋</span>
            <span class="copy-label">Copy</span>
          </button>
        </div>

        <div class="output">
          <p id="laasResult" class="output-text" aria-live="polite">
            Choose a category and click “Get a Lie”.
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> Powered by naas.isalman.dev &amp; lies-as-a-service.onrender.com</p>
  </footer>

  <!-- Load your app logic (this was the bug) -->
  <script src="app.js"></script>
  <script>
    // Footer year
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
